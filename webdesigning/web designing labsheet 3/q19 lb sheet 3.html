<!DOCTYPE html>
<html>
<body>

<h3>Press any key</h3>
<div id="result"></div>

<script>
document.addEventListener("keydown", function(event) {
    document.getElementById("result").innerHTML =
        "Key: " + event.key +
        "<br>Key Code: " + event.code;
});

document.addEventListener("keyup", function(event) {
    console.log("Key released:", event.key);
});
</script>

</body>
</html>
